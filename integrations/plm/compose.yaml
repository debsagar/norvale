services:
  plm:
    image: inventree/inventree:1.3.6@sha256:8978188efb0e48f88aa15a2ef9a7f6c4c8d039ff76a9b836e54648fcb96a1e73
    command: ["sh", "-c", "exec gunicorn -c ./gunicorn.conf.py InvenTree.norvale_wsgi -b $${INVENTREE_WEB_ADDR}:$${INVENTREE_WEB_PORT} --chdir $${INVENTREE_BACKEND_DIR}/InvenTree"]
    mem_limit: 768m
    cpus: 1.0
    ports:
      - "127.0.0.1:${PLM_PORT:?choose an unused port}:8000"
    environment:
      NORVALE_PLM_CHANGE_GUARD: "${NORVALE_PLM_CHANGE_GUARD:-0}"
      INVENTREE_DB_ENGINE: sqlite3
      INVENTREE_DB_NAME: /home/inventree/data/plm.sqlite3
      INVENTREE_SITE_URL: http://127.0.0.1:${PLM_PORT}
      INVENTREE_GUNICORN_WORKERS: "1"
      INVENTREE_BACKGROUND_WORKERS: "1"
      INVENTREE_PLUGINS_ENABLED: "False"
      INVENTREE_SENTRY_ENABLED: "False"
    volumes:
      - ./company_wsgi.py:/home/inventree/src/backend/InvenTree/InvenTree/norvale_wsgi.py:ro
      - ./change_guard.py:/home/inventree/src/backend/InvenTree/InvenTree/norvale_change_guard.py:ro
      - data:/home/inventree/data
volumes:
  data:
